<aside>
    <!--begin::Sidebar Brand-->
    <div class="sidebar-brand">
        <!--begin::Brand Link-->
        <a href="/" class="brand-link">
            <!--begin::Brand Image-->
            <img src="./assets/images/logo.png" alt="PWY Logo" class="brand-image opacity-75 shadow" />
            <!--end::Brand Image-->
            <!--begin::Brand Text-->
            <!-- <span class="brand-text fw-light">PWY</span> -->
            <!--end::Brand Text-->
        </a>
        <!--end::Brand Link-->
    </div>
    <!--end::Sidebar Brand-->
    <!--begin::Sidebar Wrapper-->
    <div class="sidebar-wrapper">
        <nav class="mt-2">
            <!--begin::Sidebar Menu-->
            <ul class="nav sidebar-menu flex-column" data-lte-toggle="treeview" role="navigation"
                aria-label="Main navigation" data-accordion="false" id="navigation">
                <li class="nav-item menu-open">
                    <a routerLink="/dashboard" class="nav-link active">
                        <fa-icon [icon]="faChartColumn"></fa-icon>
                        <p>
                            Dashboard
                            <i class="nav-arrow bi bi-chevron-right"></i>
                        </p>
                    </a>
                </li>
                <li class="nav-item">
                    <a routerLink="/events" class="nav-link">
                        <fa-icon [icon]="faCalendarDays"></fa-icon>
                        <p>Events</p>
                    </a>
                </li>
                <li class="nav-item">
                    <a routerLink="/users" class="nav-link">
                        <fa-icon [icon]="faUsers"></fa-icon>
                        <p>Users</p>
                    </a>
                </li>
                <li class="nav-item">
                    <a routerLink="/settings" class="nav-link active">
                        <fa-icon [icon]="faGear"></fa-icon>
                        <p>Settings</p>
                    </a>
                </li>




            </ul>
            <!--end::Sidebar Menu-->
        </nav>
    </div>
    <!--end::Sidebar Wrapper-->
</aside>
